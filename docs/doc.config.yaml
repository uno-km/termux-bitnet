# 5. 고급 파라미터 본문
advanced_parameters_body: |
  <h3>1. 1.58-Bit Ternary Kernel Vectorization</h3>
  <p>Traditional floating-point neural network inference relies heavily on Multiply-Accumulate (MAC) operations. BitNet 1.58-bit constrains weights to the ternary set:</p>
  <pre><code>W ∈ {-1, 0, +1}^{m × n}</code></pre>
  <p>Matrix multiplication $Y = W \cdot X$ is converted into vectorized additions and subtractions of activation vectors. The ARM64 NEON Dot-Product engine executes these operations via <code>vdotq_s32</code> instructions, maximizing throughput while minimizing transistor switching energy.</p>

  <h3>2. Memory Footprint &amp; Android LMK Defense</h3>
  <p>Android OS executes the <strong>Low Memory Killer (LMK)</strong> when free system memory falls below critical thresholds (typically 300MB ~ 500MB). Termux-BitNet protects against LMK aborts via:</p>
  <ul style="margin-left: 20px; line-height: 1.8;">
    <li><strong>Zero-Copy Memory Mapping (<code>mmap</code>)</strong>: Model weights remain mapped directly from disk into read-only virtual address space, sharing pages with the OS cache.</li>
    <li><strong>Pre-Allocated KV Cache Ring Buffers</strong>: Prevents continuous heap allocation and fragmentation during autoregressive generation.</li>
    <li><strong>Sub-350MB Peak Working Set</strong>: Operates safely within low-RAM mobile devices (Galaxy A-series, S-series).</li>
  </ul>

  <h3>3. KV Cache Context Memory Formulation</h3>
  <p>Context window memory allocation is strictly bounded by the formula:</p>
  <pre><code>KV_Cache_Bytes = 2 × n_layers × n_heads × d_head × n_ctx × 2 (FP16)</code></pre>
  <p>For BitNet 2B with $n_{\text{ctx}} = 2048$, KV Cache consumes approximately 128MB, ensuring lightweight on-device execution.</p>

  <h3>4. Hyperparameter Tuning Recommendations</h3>
  <table class="data-table">
    <thead>
      <tr><th>Generation Goal</th><th>Recommended Temperature</th><th>Top-P</th><th>Top-K</th><th>Repeat Penalty</th></tr>
    </thead>
    <tbody>
      <tr><td><strong>Deterministic Coding &amp; Math</strong></td><td><code>0.0</code> (Greedy)</td><td><code>1.0</code></td><td><code>1</code></td><td><code>1.10</code></td></tr>
      <tr><td><strong>Structured Factual Chat</strong></td><td><code>0.7</code></td><td><code>0.95</code></td><td><code>40</code></td><td><code>1.15</code></td></tr>
      <tr><td><strong>Creative Storytelling / Personas</strong></td><td><code>1.1</code></td><td><code>0.90</code></td><td><code>80</code></td><td><code>1.25</code></td></tr>
    </tbody>
  </table>

# 6. 릴리즈 아카이브 및 변경 이력 (Changelog)
changelog:
  - version: "v1.0.6"
    date: "2026-08-26"
    title: "Zero-Isolation Fast Build & Dual CLI Namespace Architecture"
    type: "Latest Production Release"
    changes:
      - "<strong>pip-build-env CMake 소스 컴파일 병목 완전 제거</strong>: <code>pyproject.toml</code>의 <code>build-system.requires</code>에서 <code>cmake</code> 의존성을 제거하여 pip 빌드 격리 환경 내 수십 분 소요 C++ 컴파일 시도를 원천 차단하고 Termux 네이티브 <code>cmake</code>를 직접 바이패스 참조"
      - "<strong>npm <code>EEXIST</code> 글로벌 심볼릭 링크 충돌 해결</strong>: Node.js 패키지의 실행 파일명을 <code>termux-bitnet-js</code> 및 <code>termux-bitnet-node</code>로 분리 정의하여 Python <code>termux-bitnet</code> 바이너리와 충돌 없이 독립 공존"
      - "<strong>원터치 인스톨러(<code>install.sh</code>) 최적화</strong>: 선행 <code>setuptools</code>/<code>wheel</code> 프로비저닝 및 <code>pip install --no-build-isolation -e .</code> 적용으로 2중 컴파일 비효율 제거 (빌드 시간 14s -&gt; 3s 단축)"
