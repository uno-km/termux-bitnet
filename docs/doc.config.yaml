# termux-bitnet/docs/doc.config.yaml
name: "Termux-BitNet"
package_name_pypi: "termux-bitnet"
package_name_npm: "termux-bitnet"
version: "v1.0.6"
release_name: "Production Ready"
license: "Apache-2.0"
platform: "Android ARM64 / NEON SIMD"
github_repo_url: "https://github.com/uno-km/termux-bitnet"

# 1줄 핵심 사명
tagline_en: "ARM64 NEON DotProd SIMD Accelerated 1.58-bit On-Device LLM Inference Engine"
tagline_ko: "ARM64 NEON DotProd SIMD 어셈블리 가속 1.58-bit 온디바이스 초고속 LLM 추론 엔진"

# 빠른 설치 명령어
quick_install_cmd: "pip install termux-bitnet\n# or: npm install -g termux-bitnet"

# 기술 과제 및 혁신 설명
why_challenge_en: "Standard FP16/INT4 LLM inference on mobile CPU architectures encounters extreme memory bandwidth bottlenecks, thermal throttling, and severe battery drain exceeding 15W."
why_challenge_ko: "모바일 CPU 환경에서 표준 FP16/INT4 대규모 언어 모델 추론은 극심한 메모리 대역폭 병목과 15W 이상의 발열 및 배터리 소모를 유발합니다."

description_en: "Executes 1.58-bit ternary quantized weights {-1, 0, +1} directly via hand-vectorized ARM64 NEON assembly kernels, reducing matrix multiplications to integer additions and subtractions with under 350MB RAM footprint."
description_ko: "3진화 1.58-bit 가중치 {-1, 0, +1}를 최적화된 ARM64 NEON 어셈블리 커널로 직접 실행하여 행렬 곱셈을 정수 덧셈/뺄셈으로 치환하고 350MB 미만의 초경량 메모리로 고속 온디바이스 추론을 지원합니다."

# 핵심 역량 (엄격한 무이모지 규격)
features:
  - title_en: "1.58-Bit Ternary DotProd Acceleration"
    title_ko: "1.58-bit 삼진 연산 DotProd 하드웨어 가속"
    desc_en: "Replaces multiplication with integer additions using ARM64 dot-product vector SIMD instructions."
    desc_ko: "ARM64 Dot-Product 벡터 SIMD 명령어를 활용하여 고비용 부동소수점 곱셈을 정수 덧셈으로 대체합니다."
  - title_en: "Zero-PRoot Native Bionic Execution"
    title_ko: "비루트 네이티브 Bionic 직접 구동"
    desc_en: "Direct execution on Android Bionic libc without Linux PRoot containers or root privileges."
    desc_ko: "루팅이나 가상 리눅스(PRoot) 컨테이너 없이 안드로이드 순정 Bionic libc 환경에서 즉각 구동됩니다."
  - title_en: "Dual-Engine Python & Node.js Gateways"
    title_ko: "Python 및 Node.js 듀얼 게이트웨이"
    desc_en: "Ultra-low overhead thin FFI bindings for both Python 3.8+ and Node.js 18+ runtimes with independent CLI namespaces."
    desc_ko: "독립된 CLI 네임스페이스와 함께 Python 3.8+ 및 Node.js 18+ 런타임을 위한 경량 FFI 바인딩을 제공합니다."
  - title_en: "Energy-Efficient Edge Deployment"
    title_ko: "초저전력 스마트폰 구동"
    desc_en: "Consumes under 2.5W during continuous token generation, preventing thermal throttling."
    desc_ko: "지속 토큰 생성 시 2.5W 미만의 초저전력을 소모하여 스마트폰의 발열 쓰로틀링을 효과적으로 방지합니다."

# 연산 매트릭스 표
matrix_table:
  - category: "Inference Kernel"
    operations: "ARM64 NEON DotProd, i2_s Ternary SIMD, Multi-core Thread Scheduling"
    status: "Production"
  - category: "Memory & Cache"
    operations: "Zero-Copy Safetensors mmap, Direct KV Cache Pooling"
    status: "Production"
  - category: "Language Bindings"
    operations: "Python CFFI / ctypes (termux-bitnet), Node.js Gateway (termux-bitnet-js)"
    status: "Production"
  - category: "Supported Models"
    operations: "BitNet b1.58 (0.7B / 1.5B / 2B / 3.3B), Llama-3-BitNet"
    status: "Production"

# 정석 실행 코드
code_example_py: |
  from termux_bitnet import BitNetEngine, BitNetConfig

  # 1. Initialize engine with model & thread configuration
  config = BitNetConfig(
      model_path="models/bitnet-2b.gguf",
      n_threads=4,
      temperature=0.7,
      top_p=0.95
  )

  # 2. Stream tokens in real time
  with BitNetEngine(config) as engine:
      for token in engine.generate_stream("Explain quantum computing in one sentence:"):
          print(token, end="", flush=True)

code_example_js: |
  const { createEngine } = require('termux-bitnet');

  async function main() {
    const engine = createEngine({
      modelPath: 'models/bitnet-2b.gguf',
      threads: 4,
      temperature: 0.7
    });

    await engine.generateStream('Explain quantum computing in one sentence:', 64, (token) => {
      process.stdout.write(token);
    });
  }

  main();

# 1. 설치 가이드 본문
installation_body: |
  <div class="alert alert-tip">
    <span class="alert-title">Target Environment &amp; Prerequisites</span>
    <p>Engineered for native execution on Android Termux (ARM64 / aarch64), Ubuntu/Debian ARM64, and Linux. Requires Python 3.8+ or Node.js 18+.</p>
  </div>

  <h3>1. Android Termux One-Touch Setup (Recommended)</h3>
  <p>Update repository packages and install required native build toolchains in a single command:</p>
  <pre><code class="language-bash"># 1. Install toolchains and dependencies
  pkg update -y
  pkg install -y clang cmake git python python-pip openblas libandroid-execinfo nodejs

  # 2. Pre-provision Python build tools (Bypasses PyPI build-isolation bottleneck)
  pip install --upgrade setuptools wheel

  # 3. Install termux-bitnet Python SDK &amp; CLI
  pip install --no-build-isolation termux-bitnet</code></pre>

  <h3>2. Node.js Dual Engine Gateway (npm)</h3>
  <p>Install the ultra-lightweight Node.js thin gateway with dedicated CLI namespace:</p>
  <pre><code class="language-bash"># Global install without binary conflict (Provides termux-bitnet-js)
  npm install -g termux-bitnet</code></pre>

  <h3>3. Hardware SIMD Diagnostics Verification</h3>
  <p>Execute the diagnostic CLI to confirm ARM NEON and DotProd (<code>vdotq_s32</code>) hardware acceleration:</p>
  <pre><code class="language-bash"># Python CLI check
  termux-bitnet info

  # Node.js CLI check
  termux-bitnet-js info</code></pre>

  <h3>4. Source Installation from GitHub</h3>
  <pre><code class="language-bash">git clone https://github.com/uno-km/termux-bitnet.git
  cd termux-bitnet
  chmod +x install.sh
  ./install.sh</code></pre>

# 2. 퀵스타트 본문
quickstart_body: |
  <h3>Recipe 1: Model Hub Download &amp; CLI Inference</h3>
  <p>Query verified 1.58-bit GGUF models, download with HTTP Range resume support, and execute instant inference:</p>
  <pre><code class="language-bash"># 1. List official verified models
  termux-bitnet models

  # 2. Download Microsoft BitNet 2B-4T (1.13 GB)
  termux-bitnet download bitnet-2b

  # 3. Run prompt inference with 4 CPU threads
  termux-bitnet run -m ~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf \
    -p "Explain quantum computing in one sentence." \
    -t 4 -c 2048 -n 64 --temp 0.7 --top-p 0.95</code></pre>

  <h3>Recipe 2: Python SDK Token Streaming</h3>
  <p>Stream generated tokens asynchronously with context manager memory cleanup:</p>
  <pre><code class="language-python">from termux_bitnet import BitNetEngine, BitNetConfig

  config = BitNetConfig(
      model_path="models/bitnet-2b.gguf",
      n_threads=4,
      temperature=0.7,
      top_p=0.95,
      top_k=40,
      repeat_penalty=1.15
  )

  with BitNetEngine(config) as engine:
      print("[Prompt]: Explain quantum computing in one sentence.")
      print("[Response]: ", end="", flush=True)
      for token in engine.generate_stream("Explain quantum computing in one sentence:"):
          print(token, end="", flush=True)
      print()</code></pre>

  <h3>Recipe 3: Node.js / TypeScript Gateway Streaming</h3>
  <pre><code class="language-javascript">const { createEngine } = require('termux-bitnet');

  async function main() {
    const engine = createEngine({
      modelPath: 'models/bitnet-2b.gguf',
      threads: 4,
      temperature: 0.7,
      topP: 0.95
    });

    console.log('[Prompt]: Explain quantum computing in one sentence');
    console.log('[Response]: ');

    await engine.generateStream(
      'Explain quantum computing in one sentence',
      64,
      (token) => {
        process.stdout.write(token);
      }
    );
    console.log('\n');
  }

  main();</code></pre>

  <h3>Recipe 4: OpenAI-Compatible Local HTTP API Server</h3>
  <pre><code class="language-bash"># Start local API server on port 8080
  termux-bitnet serve --port 8080 --model ~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf

  # Query via standard OpenAI client or curl
  curl http://localhost:8080/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "bitnet-2b",
      "messages": [{"role": "user", "content": "Hello BitNet!"}]
    }'</code></pre>

# 3. API 레퍼런스 본문
api_body: |
