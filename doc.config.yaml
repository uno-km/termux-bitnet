why_challenge_en: Standard FP16/INT4 LLM inference on mobile architectures suffers from memory bandwidth saturation, severe battery drain, and thermal throttling. Furthermore, mobile 1.58-bit execution historically lacked unified GPU compute pipelines and dedicated Vulkan compute shaders.
why_challenge_ko: 모바일 CPU 환경에서 표준 FP16/INT4 대형 언어 모델 추론은 극심한 메모리 대역폭 병목과 15W 이상의 발열 및 배터리 소모를 유발합니다. 아울러 모바일 1.58-bit 가중치는 전용 모바일 GPU 컴퓨트 셰이더 부재로 인해 CPU 연산 한계에 묶여 있었습니다.
description_en: Executes 1.58-bit ternary quantized weights {-1, 0, +1} directly via hand-vectorized ARM64 NEON assembly kernels and native Vulkan compute shaders powered by AMEVA-Runtime, achieving up to 17.56 tok/s (12.58x speedup) on Qualcomm Adreno 830 and 3.47 tok/s (5.94x speedup) on ARM Mali-G68 under a sub-250MB RAM footprint.
description_ko: 3진화 1.58-bit 가중치 {-1, 0, +1}를 최적화된 ARM64 NEON 어셈블리 커널 및 AMEVA-Runtime 네이티브 Vulkan 컴퓨트 셰이더로 직접 실행하여, 퀄컴 Adreno 830에서 최대 17.56 tok/s (12.58배 속도 향상), ARM Mali-G68에서 3.47 tok/s (5.94배 속도 향상)의 고속 온디바이스 추론을 250MB 미만 메모리로 제공합니다.
features:
- title_en: Native Vulkan Compute GPU Acceleration
  title_ko: 네이티브 Vulkan Compute GPU 가속 & AMEVA-Runtime 연계
  desc_en: Powered by AMEVA-Runtime's modular SPIR-V compute pipeline (Ternary GEMV, RoPE, Attention Decode, SwiGLU, RMSNorm, FP16 LM Head), fusing 30 transformer layers into a single VkCommandBuffer submission and fence wait.
  desc_ko: AMEVA-Runtime의 모듈형 SPIR-V 컴퓨트 파이프라인(삼진 GEMV, RoPE, 어텐션 디코드, SwiGLU, RMSNorm, FP16 LM Head)을 연동하여 30개 전 계층을 단일 VkCommandBuffer 제출 및 펜스 대기로 처리합니다.
- title_en: Permanent VRAM Residency & Zero-Bus Traffic
  title_ko: 영구 VRAM 상주 파이프라인 및 호스트-디바이스 버스 트래픽 0화
  desc_en: Pre-allocates unified GPU storage buffers for all transformer layers (498 MB) and FP16 LM Head (626 MB) at initialization, eliminating host-to-device bus traffic during autoregressive token evaluation.
  desc_ko: 초기화 시 30개 트랜스포머 계층(498 MB) 및 FP16 LM Head(626 MB)를 통합 GPU 버퍼에 영구 상주시켜 추론 루프 중 호스트-디바이스 버스 전송 트래픽을 배제합니다.
- title_en: 1.58-Bit Ternary DotProd ARM NEON Core
  title_ko: 1.58-bit 삼진 연산 DotProd 벡터 SIMD 코어
  desc_en: Hand-vectorized ARM64 Dot-Product (vdotq_s32) assembly kernels replace floating-point matrix multiplications with integer additions and subtractions.
  desc_ko: ARM64 Dot-Product(vdotq_s32) 벡터 SIMD 명령어로 부동소수점 곱셈을 정수 덧셈으로 치환하여 초저전력 연산을 구현합니다.
- title_en: Dynamic Hyperparameter Synchronization
  title_ko: C ABI 기반 동적 하이퍼파라미터 동기화
  desc_en: Dynamically updates temperature, top_p, top_k, repeat_penalty, and stop tokens at runtime via thread-safe bitnet_set_params without reallocating model weights.
  desc_ko: 모델 재할당 없이 스레드 안전한 bitnet_set_params C ABI를 통해 런타임에 temperature, top_p, top_k, repeat_penalty, stop_tokens를 동적으로 갱신합니다.
- title_en: Truthful Telemetry Ground Truth
  title_ko: 검증된 텔레메트리 실측치 계측
  desc_en: Accurately measures prompt_tokens, tokens_per_second, and TTFT across physical Samsung Galaxy hardware under strict zero-hype engineering standards.
  desc_ko: 엄격한 무과장 엔지니어링 표준 하에 실제 삼성 갤럭시 기기에서 prompt_tokens, tokens_per_second, TTFT를 정밀하게 계측하여 보고합니다.
