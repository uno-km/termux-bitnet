code_example_py: "from termux_bitnet import BitNetEngine, BitNetConfig\n\n# 1. Initialize\
  \ engine with model & thread configuration\nconfig = BitNetConfig(\n    model_path=\"\
  ~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf\",\n    n_threads=4,\n\
  \    device=\"auto\",\n    temperature=0.7,\n    top_p=0.95\n)\n\n# 2. Stream tokens\
  \ in real time with dynamic parameter updates\nwith BitNetEngine(config) as engine:\n\
  \    print(\"[Prompt]: Explain quantum computing in one sentence.\")\n    print(\"\
  [Response]: \", end=\"\", flush=True)\n    for token in engine.generate_stream(\"\
  Explain quantum computing in one sentence:\"):\n        print(token, end=\"\", flush=True)\n\
  \    print()\n    metrics = engine.get_last_metrics()\n    print(f\"Speed: {metrics.tokens_per_second:.2f}\
  \ tok/s, Prompt tokens: {metrics.prompt_tokens}\")\n"
code_example_js: "const { createEngine } = require('termux-bitnet');\n\nasync function\
  \ main() {\n  const engine = createEngine({\n    modelPath: '~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf',\n\
  \    threads: 4,\n    device: 'auto',\n    temperature: 0.7,\n    topP: 0.95\n \
  \ });\n\n  console.log('[Prompt]: Explain quantum computing in one sentence');\n\
  \  console.log('[Response]: ');\n\n  await engine.generateStream('Explain quantum\
  \ computing in one sentence', 64, (token) => {\n    process.stdout.write(token);\n\
  \  });\n  console.log('\\n');\n}\n\nmain();\n"
