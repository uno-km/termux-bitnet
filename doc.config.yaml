advanced_parameters_body: |
  <h3>1. Hallucination Prevention & Prompt Template Wrapping Guide</h3>
  <p>In <code>v2.0.1</code>, user-configurable prompt formatting flags resolve conversational divergence and word-salad by ensuring model-specific dialogue boundaries:</p>
  <ul>
    <li><code>--prompt-template chatml</code>: Formats prompt using canonical ChatML tags (<code>&lt;|im_start|&gt;user\n{prompt}&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n</code>). Required for <strong>Falcon3-7B Instruct</strong>.</li>
    <li><code>--prompt-template falcon</code>: Enforces Falcon instruction format. Required for <strong>Falcon-E-1B Instruct</strong>.</li>
    <li><code>--prompt-template raw</code>: Disables wrapping and passes raw text directly. Recommended for <strong>BitNet 2B-4T</strong> base reasoning.</li>
    <li><code>--prompt-prefix &lt;str&gt;</code> & <code>--prompt-suffix &lt;str&gt;</code>: Custom dialogue wrapping prefixes/suffixes.</li>
    <li><code>--eos-token-id &lt;int&gt;</code>: Override end-of-sequence token ID to prevent infinite token run-on.</li>
  </ul>

  <h3>2. Supported Models & Optimal Deployment Matrix</h3>
  <table class="data-table">
    <thead>
      <tr>
        <th>Model Name</th>
        <th>Weights File</th>
        <th>Activation</th>
        <th>Recommended Template</th>
        <th>Recommended GPU Flags</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>Microsoft BitNet 2B-4T</strong></td>
        <td><code>bitnet-2b-ggml-model-i2_s.gguf</code></td>
        <td><code>--act-fn relu2</code></td>
        <td><code>--prompt-template raw</code></td>
        <td><code>-ngl 30</code> (Full GPU offload)</td>
      </tr>
      <tr>
        <td><strong>TII Falcon-E 1B Instruct</strong></td>
        <td><code>falcon-e-1b-instruct-i2_s.gguf</code></td>
        <td><code>--act-fn swiglu</code></td>
        <td><code>--prompt-template falcon</code></td>
        <td><code>-ngl 24</code> (Full GPU offload)</td>
      </tr>
      <tr>
        <td><strong>TII Falcon3 7B Instruct</strong></td>
        <td><code>falcon3-7b-instruct-i2_s.gguf</code></td>
        <td><code>--act-fn swiglu</code></td>
        <td><code>--prompt-template chatml</code></td>
        <td><code>--chunk-layers 4 --vocab-slice 32768</code></td>
      </tr>
      <tr>
        <td><strong>BitNet Embedding 270M</strong></td>
        <td><code>bitnet-b1.58-270M-embed-i2_s.gguf</code></td>
        <td>Linear / RMSNorm</td>
        <td><code>--prompt-template raw</code></td>
        <td>CPU / Zero-Copy Mmap Vector Search</td>
      </tr>
    </tbody>
  </table>

  <h3>3. Mobile GPU Memory Slicing & Watchdog Defense Architecture</h3>
  <p>To operate 7B scale models reliably across heterogeneous mobile chipsets, <code>v2.0.1</code> introduces hardware-level execution governance:</p>
  <ul>
    <li><strong>Fence Chunking (<code>--chunk-layers 4</code>)</strong>: Splits the 28-layer transformer graph into 4-layer command buffer sub-dispatches with intermediate fence waits. This completely bypasses the ARM Mali 2,500ms kernel watchdog timer on Exynos 1280/1380 devices.</li>
    <li><strong>Vocabulary Slicing (<code>--vocab-slice 32768</code>)</strong>: Falcon3-7B features a massive 131,080-token FP16 vocabulary matrix consuming 768MB VRAM. By slicing the linear projection to the top 32,768 tokens and masking non-computed logits to <code>-1e9f</code>, VRAM consumption drops to 192MB (-576MB reduction) with zero impact on common vocabulary generation.</li>
  </ul>

  <h3>4. Mathematical Resolution of Ternary Numerical Collapse</h3>
  <p>In accordance with technical whitepaper <code>AOSF-TR-2026-BITNET-TERNARY-02</code>, low-level unpacking maps 2-bit unsigned containers to ternary weights using canonical relation:</p>
  <pre><code>// Canonical Microsoft BitNet b1.58 dequantization formula:
  int8_t w0 = (int8_t)(byte_val & 3) - 1;
  int8_t w1 = (int8_t)((byte_val >> 2) & 3) - 1;
  int8_t w2 = (int8_t)((byte_val >> 4) & 3) - 1;
  int8_t w3 = (int8_t)((byte_val >> 6) & 3) - 1;

  // Integrated 32-byte GGUF tensor trailer weight scale:
  float total_scale = dequant_scale * weight_scale;
  out[r] *= total_scale;</code></pre>

  <h3>5. Upstream Open-Source Contributions & Credibility</h3>
  <p>Our foundational research directly powers and resolves global open-source issues across Microsoft and GGML:</p>
  <ul>
    <li><a href="https://github.com/microsoft/BitNet/pull/551" target="_blank"><strong>microsoft/BitNet #551</strong></a>: Solved ARM QK=128 stride tensor corruption and word salad.</li>
    <li><a href="https://github.com/microsoft/BitNet/pull/624" target="_blank"><strong>microsoft/BitNet #624</strong></a>: Completed 1x4_32W parallel NEON sdot acceleration kernel with Android Termux tooling.</li>
    <li><a href="https://github.com/ggml-org/whisper.cpp/pull/4089" target="_blank"><strong>ggml-org/whisper.cpp #4089</strong></a>: Mobile heterogeneous GPU-Encoder / CPU-Decoder split-mode pipeline.</li>
    <li><a href="https://uno-km.vercel.app/labs/?menu=research-papers" target="_blank"><strong>AOSF-TR-2026-BITNET-TERNARY-02</strong></a>: Official Foundation Research Technical Whitepaper on ARM64 1.58-bit Ternary Numerical Collapse.</li>
  </ul>

changelog:
- version: v2.0.1
  date: '2026-10-01'
  title: Hallucination Prevention Prompt Wrapping, Mali GPU Chunking & Multi-Device Hardening
  type: Patch and Engineering Hardening Release
  changes:
  - '<strong>Hallucination Prevention Prompt Wrapping</strong>: Introduced configurable --prompt-template (chatml, falcon, raw, none) alongside custom prefixes/suffixes and EOS overrides to eliminate conversational divergence across models.'
  - '<strong>Mali Watchdog Timeout Prevention</strong>: Introduced --chunk-layers (default 4) command-line option to slice GPU command dispatch buffers, eliminating the 2.5s Mali GPU watchdog fence timeout on Exynos devices.'
  - '<strong>Dynamic Vocabulary Slicing</strong>: Added --vocab-slice (default 32768) option to dynamically slice LM Head linear projection, reducing GPU VRAM allocation by 576MB.'
  - '<strong>Architecture Routing Control</strong>: Added explicit --act-fn (auto, relu2, swiglu) flag for user-directed mathematical activation kernel selection.'
  - '<strong>Full GPU Acceleration Engine Audit</strong>: Comprehensive inventory and validation of all 8 GLSL compute shaders, compiled SPIR-V bytecode binaries, embedded C++ array headers, and dynamic Vulkan loader.'
- version: v2.0.0
  date: '2026-10-01'
  title: Sovereign Ternary - Universal Multi-Model 1.58-Bit Engine & 7B Edge Inference
  type: Major Architectural Generation Release
  changes:
  - '<strong>Root-Cause Elimination of Word Salad</strong>: Corrected GGUF i2_s ternary bit unpacking from legacy (b & 1) - (b >> 1) to canonical w = (b & 3) - 1, preventing 49.6% zero neuron corruption from causing activation norm explosion.'
  - '<strong>32-Byte Tensor Trailer Weight Scale Integration</strong>: Restores exact dequantization scaling S_W = mean(|W|) across 30 transformer layers, preserving calibrated logit distributions.'
  - '<strong>Zero-Overhead Dynamic Activation Dispatcher</strong>: Introspects layer weight tensors to dynamically auto-dispatch between Squared ReLU with Sub-LayerNorm (Microsoft BitNet 2B) and standard SwiGLU SiLU (Falcon-E-1B, Falcon3-7B).'
  - '<strong>6GB RAM 7.45B Model Edge Inference</strong>: Verified Zero-Copy mmap streaming of 3.05GB Falcon3-7B model on Galaxy A53 and A35 without Android Low Memory Killer (LMK) eviction.'
  - '<strong>Real-Time Conversational Generation (9.69 tok/s)</strong>: Achieved 9.69 tok/s on Galaxy A53 running Falcon-E-1B, delivering completely offline interactive dialog on mainstream mobile silicon.'
  - '<strong>Multi-Model Fleet Scorecard Published</strong>: Documented verified ground truth across Galaxy S25, Galaxy A53, and Galaxy A35 for 4 distinct 1.58-bit model families.'
  - '<strong>Foundation Research Whitepaper Linkage</strong>: Directly linked to official monograph AOSF-TR-2026-BITNET-TERNARY-02 and upstream PRs #551 and #624.'
