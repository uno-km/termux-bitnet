  status: Production
- category: Memory Governance
  operations: Zero-Copy Safetensors/GGUF mmap Streaming, Direct KV Cache, 6GB RAM Android LMK Defense
  status: Production
- category: Language Bindings
  operations: Python CFFI / ctypes (termux-bitnet), Node.js Thin Gateway (termux-bitnet-js), AMEVA Component SDK
  status: Production
code_example_py: |
  from termux_bitnet import BitNetEngine, BitNetConfig

  # 1. Initialize engine with multi-model support (BitNet 2B, Falcon-E 1B, Falcon3 7B)
  config = BitNetConfig(
      model_path="~/.cache/termux-bitnet/models/falcon-e-1b-instruct-i2_s.gguf",
      device="auto",        # "auto", "cpu", or "gpu" (Vulkan via ameva-runtime)
      n_threads=4,
      temperature=0.7,
      top_p=0.95
  )

  # 2. Stream tokens in real time (9.69 tok/s on Galaxy A53)
  with BitNetEngine(config) as engine:
      print("[Prompt]: Explain quantum entanglement in one sentence.")
      print("[Response]: ", end="", flush=True)
      for token in engine.generate_stream("Explain quantum entanglement in one sentence:"):
          print(token, end="", flush=True)
      print()
      metrics = engine.get_last_metrics()
      print(f"Speed: {metrics.tokens_per_second:.2f} tok/s | Prompt tokens: {metrics.prompt_tokens}")
code_example_js: |
  const { createEngine } = require('termux-bitnet');

  async function main() {
    // 1. Initialize engine with dynamic activation support
    const engine = createEngine({
      modelPath: '~/.cache/termux-bitnet/models/falcon-e-1b-instruct-i2_s.gguf',
      device: 'auto',      // 'auto', 'cpu', or 'gpu'
      threads: 4,
      temperature: 0.7,
      topP: 0.95
    });

    console.log('[Prompt]: Explain quantum computing in one sentence');
    console.log('[Response]: ');

    await engine.generateStream('Explain quantum computing in one sentence', 64, (token) => {
      process.stdout.write(token);
    });
    console.log('\n');
  }

  main();
