advanced_parameters_body: |
  <h3>1. Native Vulkan Compute Acceleration via AMEVA-Runtime</h3>
  <p>Version 1.4.0 integrates with <code>dev/ameva-runtime</code> to execute all 30 transformer layers and FP16 LM Head directly on mobile GPU hardware:</p>
  <ul>
    <li><strong>bitnet_gemv_i2_s.comp</strong>: 1.58-bit ternary matrix-vector product compute kernel.</li>
    <li><strong>bitnet_gemv_f16.comp</strong>: 626.2 MB FP16 LM Head output projection offloaded to GPU with <code>unpackHalf2x16</code>.</li>
    <li><strong>rope.comp, attention_decode.comp, swiglu_silu.comp, rmsnorm_norm.comp, residual_add.comp</strong>: Full transformer layer compute shaders.</li>
    <li><strong>DispatchFullTokenChain</strong>: Single <code>VkCommandBuffer</code> submission and single fence wait per generated token.</li>
  </ul>
  <h3>2. Dynamic C ABI Parameter Synchronization</h3>
  <p>The engine maintains thread-safe state synchronization under <code>std::mutex</code>, enabling runtime updates without reloading weights:</p>
  <pre><code>typedef struct {
      float temperature;
      float top_p;
      float min_p;
      float typical_p;
      float repeat_penalty;
      float frequency_penalty;
      float presence_penalty;
      int32_t top_k;
      int32_t repeat_last_n;
      uint32_t seed;
      const char* stop_tokens;
  } bitnet_params_t;

  int bitnet_set_params(bitnet_context_t ctx, const bitnet_params_t* params);
  int bitnet_has_vulkan(void);</code></pre>
  <h3>3. Device Routing &amp; Fallback Policy</h3>
  <table class="data-table">
    <thead>
      <tr><th>Option</th><th>Target Backend</th><th>Failure Policy</th></tr>
    </thead>
    <tbody>
      <tr><td><code>--device auto</code></td><td>Vulkan GPU via ameva-runtime if available</td><td>Safe fallback to ARM64 NEON CPU with INFO notice</td></tr>
      <tr><td><code>--device gpu</code></td><td>Vulkan GPU exclusive</td><td>Fail-Fast: Raises [ERROR: AMEVA-BITNET-E002] and exits</td></tr>
      <tr><td><code>--device cpu</code></td><td>ARM64 NEON SIMD exclusive</td><td>Direct CPU execution without GPU probe overhead</td></tr>
    </tbody>
  </table>
