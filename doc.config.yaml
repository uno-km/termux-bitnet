  - Resolved npm global symlink collision with dedicated termux-bitnet-js namespace.
  - Optimized install.sh with setuptools/wheel provisioning.
- version: v1.1.0
  date: '2026-08-20'
  title: Official Initial Engine Launch
  type: Initial Release
  changes:
  - Android Termux native Bionic libc 1.58-bit BitNet C++ inference engine initial
    release.
  - Dual Python and Node.js SDK interface.
readme_content: "# Termux-BitNet\n\n> **Production 1.58-bit (i2_s) BitNet On-Device\
  \ Inference SDK & Dual Engine for Android Termux & ARM64.**\n\n<p align=\"center\"\
  >\n  <a href=\"https://pypi.org/project/termux-bitnet/\"><img src=\"https://img.shields.io/pypi/v/termux-bitnet?color=3775A9&logo=pypi&logoColor=white&label=PyPI\"\
  \ alt=\"PyPI Version\"></a>\n  <a href=\"https://www.npmjs.com/package/termux-bitnet\"\
  ><img src=\"https://img.shields.io/npm/v/termux-bitnet?color=CB3837&logo=npm&logoColor=white&label=npm\"\
  \ alt=\"npm Version\"></a>\n  <a href=\"https://github.com/uno-km/termux-bitnet/releases/tag/v1.4.0\"\
  ><img src=\"https://img.shields.io/github/v/release/uno-km/termux-bitnet?color=0969da&logo=github&logoColor=white&label=Release\"\
  \ alt=\"GitHub Release\"></a>\n  <a href=\"https://uno-km.vercel.app/lib/bitnet/\"\
  ><img src=\"https://img.shields.io/badge/Docs-Portal%20(13%20Langs)-004499.svg?logo=googlechrome&logoColor=white\"\
  \ alt=\"Documentation Portal\"></a>\n  <a href=\"https://opensource.org/licenses/Apache-2.0\"\
  ><img src=\"https://img.shields.io/badge/License-Apache_2.0-blue.svg?logo=apache&logoColor=white\"\
  \ alt=\"License\"></a>\n  <img src=\"https://img.shields.io/badge/Core-Native%20C%2B%2B17%20%7C%20NEON%20%7C%20DotProd-brightgreen.svg?logo=cplusplus&logoColor=white\"\
  \ alt=\"Core C++\">\n  <img src=\"https://img.shields.io/badge/Platform-Android%20Termux%20%7C%20ARM64%20%7C%20Linux-orange.svg?logo=android&logoColor=white\"\
  \ alt=\"Platform\">\n</p>\n\n---\n\n> [!WARNING]\n> ### Public Engineering Disclosure\
  \ & Upstream Contributions: Permanent Elimination of Interim Heuristics\n>\n> In\
  \ earlier development iterations prior to `v1.3.0`, when confronted with upstream\
  \ ARM dequantization mismatches and missing NEON kernel paths in the upstream repository,\
  \ an interim heuristic fallback was temporarily utilized to produce candidate outputs\
  \ under mobile device constraints.\n>\n> This technical limitation has been **completely\
  \ resolved, validated on real hardware, and permanently eliminated**. Through architectural\
  \ reverse engineering and direct upstream contributions to Microsoft's official\
  \ `microsoft/BitNet` ecosystem:\n>\n> 1. **Upstream PR #551 ([microsoft/BitNet#551](https://github.com/microsoft/BitNet/pull/551))**:\
  \ Identified and isolated the original ARM `i2_s` tensor corruption (\"word salad\"\
  ) and layout divergence on mobile architectures.\n> 2. **Upstream PR #624 ([microsoft/BitNet#624](https://github.com/microsoft/BitNet/pull/624))**:\
  \ Fully implemented the missing `__ARM_NEON` 4-row parallel kernel (`1x4_32W`) utilizing\
  \ ARMv8.2-A `sdot` hardware dot-product acceleration, automated Android Termux environment\
  \ detection, and validated genuine on-device inference on Samsung Galaxy devices\
  \ (Snapdragon 8 Elite and Exynos 1380).\n> 3. **Mathematical Resolution of Dequantization\
  \ Centering**: Solved the 32-way interleaved dequantization center mismatch (correcting\
  \ unsigned raw $\\{0, 1, 2\\}$ mapping vs. centered $\\{-1, 0, 1\\}$ dot product\
  \ with activation summation), eradicating repetitive token degeneration defects.\n\
  > 4. **Strict Zero-Mock & Fail-Fast Engineering Standard**: Operating strictly with\
  \ 100% genuine on-device C++ inference. If a native binary or kernel cannot execute,\
  \ the engine strictly fails fast with explicit error codes and remediation steps\
  \ rather than emitting deceptive mock responses.\n>\n> **Verified Real-Device On-Device\
  \ Benchmarks (BitNet b1.58 2B-4T i2_s natively inside Android Termux):**\n> - **Samsung\
  \ Galaxy S25** (Snapdragon 8 Elite / Oryon CPU): **5.12 tokens/sec** (~195.3 ms/tok\
  \ prompt eval)\n> - **Samsung Galaxy A35 5G** (Samsung Exynos 1380): **1.57 tokens/sec**\
  \ (~636.9 ms/tok prompt eval)\n\n---\n\n## 1. Overview & Architecture\n\n`termux-bitnet`\
  \ is an optimized on-device inference engine and dual SDK (Python & Node.js) engineered\
  \ for running **1.58-bit quantized Large Language Models (BitNet b1.58)** natively\
  \ on Android Termux, ARM64 mobile processors, and edge devices.\n\nThe underlying\
  \ computation engine executes 1.58-bit ternary quantized weights `{-1, 0, +1}` directly\
  \ via hand-vectorized ARM64 NEON SIMD and DotProd vector instructions (`vdotq_s32`),\
  \ replacing floating-point matrix multiplications with integer additions and subtractions\
  \ under a sub-250MB RAM footprint.\n\n```text\n[Python Application / CLI]      \
  \  [Node.js / TypeScript App]\n       │                                     │\n\
  \       ▼ (BitNetEngine / ctypes)             ▼ (BitNetEngine / FFI)\n[termux-bitnet\
  \ Python SDK]        [termux-bitnet npm Thin Gateway]\n       │                \
  \                     │\n       └──────────────────┬──────────────────┘\n      \
  \                    │\n                          ▼ (Strict C ABI: libtermux_bitnet.so)\n\
  \         [Native C++17 BitNet Core Engine]\n                          │\n     \
  \                     ▼\n    [ARM64 NEON + DotProd (vdotq_s32) Vector Kernels]\n\
  ```\n\n---\n\n## 2. Verified BitNet GGUF Model Registry\n\n`termux-bitnet` provides\
  \ deterministic model downloading and caching from verified Hugging Face repositories\
  \ with HTTP Range resume capability:\n\n| Model Alias | Hugging Face Repository\
  \ & File | Parameters | Quantization | File Size | Target Device |\n|---|---|---|---|---|---|\n\
  | `bitnet-2b` | `microsoft/bitnet-b1.58-2B-4T-gguf` | 2.4B | `i2_s` | **1.13 GB**\
  \ | Flagship Phones (Galaxy S20+, S24, S25, Pixel) |\n| `bitnet-large` | `RichardErkhov/1bitLLM_-_bitnet_b1_58-large-gguf`\
  \ | 0.7B | `Q4_0` | **404 MB** | Entry-level / Low-RAM ARM64 Devices |\n| `bitnet-3b`\
  \ | `Green-Sky/bitnet_b1_58-3B-GGUF` | 3.3B | `q1_3` | **730 MB** | High-Capacity\
  \ Mobile Workstations |\n| `bitnet-3b-q4` | `RichardErkhov/1bitLLM_-_bitnet_b1_58-3B-gguf`\
  \ | 3.3B | `Q4_0` | **1.83 GB** | High-Precision Quantized Model |\n\n---\n\n##\
  \ 3. Installation & Verification\n\n### 3.1 Automated Installer (Precompiled Binary\
  \ or Fast Native Build)\n\nThe recommended installation method uses `install.sh`,\
  \ which automatically downloads verified ARM64 prebuilt binaries from GitHub Releases\
  \ or compiles the native C++ core on the device:\n\n```bash\ncurl -sL https://raw.githubusercontent.com/uno-km/termux-bitnet/main/install.sh\
  \ | bash\n```\n\n### 3.2 Python Package (PyPI)\n\n```bash\n# Inside Android Termux\
  \ (prerequisites: clang cmake python openblas)\npkg update && pkg install -y clang\
  \ cmake python openblas\npip install termux-bitnet\n```\n\n### 3.3 Node.js / TypeScript\
  \ Thin Gateway (npm)\n\n```bash\n# Global CLI installation (Provides 'termux-bitnet-js'\
  \ command)\nnpm install -g termux-bitnet\n```\n\n### 3.4 Hardened Manual Compilation\
  \ Workflow\n\nTo compile the native C++ engine manually with verified hardware acceleration\
  \ on Samsung Exynos (Cortex-A78/A55) or Qualcomm Snapdragon (Oryon/Kryo):\n\n```bash\n\
  # 1. Install prerequisites in Termux\npkg install -y clang cmake openblas libandroid-execinfo\n\
  \n# 2. Configure CMake with explicit NEON + DotProd and Clang toolchain\ncmake -B\
  \ build   -DGGML_NEON=ON   -DGGML_ARM_DOTPROD=ON   -DCMAKE_C_COMPILER=clang   -DCMAKE_CXX_COMPILER=clang++\
  \   -DCMAKE_BUILD_TYPE=Release\n\n# 3. Build native standalone CLI and shared library\n\
  cmake --build build --target termux-bitnet-cli -j$(nproc 2>/dev/null || echo 4)\n\
  ```\n\n---\n\n## 4. CLI Usage\n\n### 4.1 Python CLI (`termux-bitnet`)\n\n```bash\n\
  # 1. Hardware Diagnostic (ARM NEON & DotProd SIMD Verification)\ntermux-bitnet info\n\
  \n# 2. List Available Verified Models\ntermux-bitnet models\n\n# 3. Download Model\
  \ with Range Resume Support\ntermux-bitnet download bitnet-2b\n\n# 4. Run On-Device\
  \ Inference\ntermux-bitnet run -m ~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf\
  \   -p \"Explain quantum computing in one sentence.\"   -t 4 -c 2048 -n 64 --temp\
  \ 0.7 --top-p 0.95\n```\n\n### 4.2 Node.js CLI (`termux-bitnet-js`)\n\n```bash\n\
  # 1. Hardware Diagnostic\ntermux-bitnet-js info\n\n# 2. Model Registry List\ntermux-bitnet-js\
  \ models\n\n# 3. Run Inference via Node.js Gateway\ntermux-bitnet-js run -m ~/.cache/termux-bitnet/models/bitnet-2b-ggml-model-i2_s.gguf\
  \   -p \"Explain quantum computing in one sentence.\" -t 4 -n 64\n```\n\n---\n\n\
  ## 5. Programmatic API\n\n### 5.1 Python SDK\n\n```python\nfrom termux_bitnet import\
  \ BitNetEngine, BitNetConfig\n\n# 1. Configure Engine Parameters\nconfig = BitNetConfig(\n\
  \    model_path=\"models/bitnet-2b.gguf\",\n    n_threads=4,\n    device=\"auto\"\
  ,\n    temperature=0.7,\n    top_p=0.95,\n    top_k=40,\n    min_p=0.05,\n    repeat_penalty=1.15,\n\
  )\n\n# 2. Stream Generation with Dynamic Parameters\nwith BitNetEngine(config) as\
  \ engine:\n    print(\"[Prompt]: Write a Python palindrome check function\")\n \
  \   print(\"[Response]: \", end=\"\", flush=True)\n    for token in engine.generate_stream(\"\
  Write a Python palindrome check function:\"):\n        print(token, end=\"\", flush=True)\n\
  \    print()\n    metrics = engine.get_last_metrics()\n    print(f\"Speed: {metrics.tokens_per_second:.2f}\
  \ tok/s, Prompt tokens: {metrics.prompt_tokens}\")\n```\n\n### 5.2 Node.js & TypeScript\
  \ SDK\n\n```javascript\nconst { createEngine } = require('termux-bitnet');\n\nasync\
  \ function main() {\n  const engine = createEngine({\n    modelPath: 'models/bitnet-2b.gguf',\n\
  \    threads: 4,\n    device: 'auto',\n    temperature: 0.7,\n    topP: 0.95,\n\
  \  });\n\n  console.log('[Prompt]: Explain quantum computing in one sentence');\n\
  \  console.log('[Response]: ');\n\n  await engine.generateStream(\n    'Explain\
  \ quantum computing in one sentence',\n    64,\n    (token) => {\n      process.stdout.write(token);\n\
  \    }\n  );\n  console.log('\\n');\n}\n\nmain();\n```\n\n---\n\n## 6. Configuration\
  \ Parameter Matrix (`BitNetConfig`)\n\n| CLI Flag | Python (`BitNetConfig`) | Node.js\
  \ (`BitNetOptions`) | Default | Description |\n|---|---|---|---|---|\n| `-m, --model`\
  \ | `model_path` | `modelPath` | `\"\"` | Path to GGUF model binary |\n| `-p, --prompt`\
  \ | `prompt` | `prompt` | `\"\"` | Input prompt text |\n| `-t, --threads` | `n_threads`\
  \ | `threads` | `cores` | Number of CPU worker threads |\n| `-d, --device` | `device`\
  \ | `device` | `\"auto\"` | Compute backend (`auto`, `gpu`, `cpu`) |\n| `-c, --ctx-size`\
