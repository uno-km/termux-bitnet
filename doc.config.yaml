why_challenge_en: Standard FP16/INT4 LLM inference on mobile architectures suffers
  from memory bandwidth saturation, severe battery drain, and thermal throttling.
  Furthermore, mobile 1.58-bit execution faced tensor layout divergence and missing
  NEON acceleration.
why_challenge_ko: 모바일 CPU 환경에서 표준 FP16/INT4 대형 언어 모델 추론은 극심한 메모리 대역폭 병목과 15W 이상의 발열
  및 배터리 소모를 유발합니다. 아울러 모바일 1.58-bit 가중치는 텐서 레이아웃 불일치와 NEON 가속 커널 부재 문제를 겪어왔습니다.
description_en: Executes 1.58-bit ternary quantized weights {-1, 0, +1} directly via
  hand-vectorized ARM64 NEON assembly kernels and Vulkan compute shaders, converting
  matrix multiplications into integer additions and subtractions under a sub-250MB
  RAM footprint.
description_ko: 3진화 1.58-bit 가중치 {-1, 0, +1}를 최적화된 ARM64 NEON 어셈블리 커널과 Vulkan 컴퓨트
  셰이더로 직접 실행하여 행렬 곱셈을 정수 덧셈/뺄셈으로 치환하고 250MB 미만의 초경량 메모리로 고속 온디바이스 추론을 지원합니다.
features:
- title_en: 1.58-Bit Ternary DotProd & Vulkan Compute
  title_ko: 1.58-bit 삼진 연산 DotProd 및 Vulkan 하드웨어 가속
  desc_en: Replaces floating-point multiplication with vectorized integer additions
    via ARM64 vdotq_s32 SIMD and modular Vulkan SPIR-V compute shaders.
  desc_ko: ARM64 Dot-Product(vdotq_s32) 벡터 SIMD 명령어 및 모듈형 Vulkan SPIR-V 컴퓨트 셰이더를 통해
    고비용 부동소수점 곱셈을 정수 덧셈으로 대체합니다.
- title_en: Zero-PRoot Native Bionic Execution
  title_ko: 비루트 네이티브 Bionic 직접 구동
  desc_en: Direct execution on Android Bionic libc without Linux PRoot containers
    or root privileges.
  desc_ko: 루팅이나 가상 리눅스(PRoot) 컨테이너 없이 안드로이드 순정 Bionic libc 환경에서 즉각 구동됩니다.
- title_en: Dynamic Hyperparameter Synchronization
  title_ko: C ABI 기반 동적 하이퍼파라미터 동기화
  desc_en: Dynamically updates temperature, top_p, top_k, repeat_penalty, and stop
    tokens at runtime via thread-safe bitnet_set_params without reallocating model
    weights.
  desc_ko: 모델 재할당 없이 스레드 안전한 bitnet_set_params C ABI를 통해 런타임에 temperature, top_p,
    top_k, repeat_penalty, stop_tokens를 동적으로 갱신합니다.
- title_en: Truthful Telemetry Ground Truth
  title_ko: 검증된 텔레메트리 실측치 계측
  desc_en: Accurately measures prompt_tokens, tokens_per_second, and TTFT across physical
    Samsung Galaxy hardware under strict zero-hype engineering standards.
  desc_ko: 엄격한 무과장 엔지니어링 표준 하에 실제 삼성 갤럭시 기기에서 prompt_tokens, tokens_per_second, TTFT를
    정밀하게 계측하여 보고합니다.
