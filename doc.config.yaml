name: Termux-BitNet
lib_slug: bitnet
package_name_pypi: termux-bitnet
package_name_npm: termux-bitnet
version: v2.0.0
release_name: Sovereign Ternary - Universal Multi-Model 1.58-Bit Engine & 7B Edge Inference
license: Apache-2.0
platform: Android ARM64 / NEON SIMD & Adreno/Mali Vulkan
github_repo_url: https://github.com/uno-km/termux-bitnet
tagline_en: Sovereign 1.58-Bit On-Device LLM Inference Engine with ARM64 NEON DotProd SIMD & Native Vulkan GPU Acceleration
tagline_ko: ARM64 NEON DotProd SIMD 및 AMEVA-Runtime 네이티브 Vulkan GPU 가속 기반 주권형 1.58-bit 온디바이스 LLM 추론 엔진
quick_install_cmd: |
  pip install termux-bitnet ameva-runtime

  # or: npm install -g termux-bitnet @ameva/runtime

  # or: curl -sL https://raw.githubusercontent.com/uno-km/termux-bitnet/main/install.sh | bash
why_challenge_en: Standard FP16/INT4 LLM inference on mobile architectures suffers from memory bandwidth saturation, severe battery drain, and thermal throttling. Furthermore, upstream 1.58-bit execution historically suffered from ternary bitfield misallocations (word salad), missing weight scales, rigid activation functions, and lack of mobile memory management.
why_challenge_ko: 모바일 CPU 환경에서 표준 FP16/INT4 거대 언어 모델 추론은 극심한 메모리 대역폭 병목과 발열 및 배터리 소모를 유발합니다. 아울러 기존 1.58-bit 오픈소스 생태계는 삼진 비트필드 오역(워드샐러드), 가중치 스케일 누락, 단일 활성화 함수 하드코딩, 모바일 메모리 한계로 인해 파편화되어 있었습니다.
description_en: Executes 1.58-bit ternary quantized weights {-1, 0, +1} directly via hand-vectorized ARM64 NEON assembly kernels and native Vulkan compute shaders powered by AMEVA-Runtime. Features a dynamic zero-overhead activation dispatcher supporting Squared ReLU (Microsoft 2B) and SwiGLU (Falcon-E-1B / Falcon3-7B) alongside Zero-Copy mmap streaming for 7.45B model execution on 6GB RAM smartphones.
description_ko: 3진화 1.58-bit 가중치 {-1, 0, +1}를 최적화된 ARM64 NEON 어셈블리 커널 및 AMEVA-Runtime 네이티브 Vulkan 컴퓨트 셰이더로 직접 실행합니다. Squared ReLU(Microsoft 2B)와 SwiGLU(Falcon-E-1B, Falcon3-7B)를 동적 자동 분기하는 디스패처와 Zero-Copy mmap 스트리밍을 탑재하여 6GB RAM 보급형 스마트폰에서도 7.45B 대형 모델을 안정 완주합니다.
features:
- title_en: Dynamic Zero-Overhead Activation Dispatcher
  title_ko: 제로-오버헤드 다이나믹 활성화 함수 디스패처
  desc_en: Dynamically auto-dispatches between Squared ReLU (relu2) with Sub-LayerNorm (Microsoft BitNet 2B) and standard SwiGLU (SiLU) without Sub-LayerNorm (Falcon-E-1B, Falcon3-7B) based on tensor layout introspection.
  desc_ko: 가중치 텐서 구조를 실시간 판별하여 Microsoft 2B의 Squared ReLU + Sub-LayerNorm과 Falcon 계열의 SwiGLU SiLU를 제로-오버헤드로 자동 분기 구동합니다.
- title_en: Mathematical Elimination of Ternary Numerical Collapse
  title_ko: 삼진 수치 붕괴(Word Salad) 수학적 원천 박멸
  desc_en: Canonical mathematical decoding w = (b & 3) - 1 eradicates 49.6% inactive neuron corruption, while integrating 32-byte GGUF tensor trailer weight scales into GEMV scaling for calibrated logit distributions.
  desc_ko: 공식 삼진 디코딩 식 w = (b & 3) - 1을 적용하여 49.6% 뉴런 오염을 박멸하고, 32바이트 트레일러 가중치 스케일을 합성하여 로짓 수치 무결성을 복원하였습니다.
- title_en: Zero-Copy Mmap Streaming for 7.45B Edge Inference
  title_ko: 6GB RAM 단말 7.45B 완주를 위한 Zero-Copy mmap 파이프라인
  desc_en: Enables seamless on-device execution of 3.05GB 7.45B models (Falcon3-7B) on 6GB RAM devices without triggering Android Low Memory Killer (LMK) eviction.
  desc_ko: 가중치 버퍼 Zero-Copy mmap 스트리밍을 통해 가용 메모리 5.4GB의 단말기에서도 3.05GB 크기의 7.45B 모델을 OOM 크래시 없이 완주합니다.
- title_en: Real-Time Mobile Conversational Speed (9.69 tok/s)
  title_ko: 초당 9.69 토큰의 온디바이스 실시간 발화 달성
  desc_en: Generates up to 9.69 tok/s on mainstream mobile silicon (Galaxy A53 / Exynos 1280) running Falcon-E-1B, surpassing human silent reading speed completely offline.
  desc_ko: 보급형 칩셋(Exynos 1280)에서 Falcon-E-1B 구동 시 초당 9.69 토큰의 초고속 속도를 기록하여 완전 오프라인 실시간 대화를 실현합니다.
- title_en: Native Vulkan Compute GPU Acceleration
  title_ko: 네이티브 Vulkan Compute GPU 가속 & AMEVA-Runtime 연계
  desc_en: Powered by AMEVA-Runtime's modular SPIR-V compute pipeline (Ternary GEMV, RoPE, Attention Decode, SwiGLU, RMSNorm, FP16 LM Head), fusing 30 transformer layers into a single VkCommandBuffer submission.
  desc_ko: AMEVA-Runtime의 모듈형 SPIR-V 컴퓨트 파이프라인을 연동하여 30개 전 계층을 단일 VkCommandBuffer 제출로 초고속 가속합니다.
