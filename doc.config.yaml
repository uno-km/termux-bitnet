advanced_parameters_body: "<h3>1. Dynamic C ABI Parameter Synchronization</h3>\n<p>Version\
  \ 1.4.0 introduces <code>bitnet_set_params</code> in the native C ABI layer. The\
  \ engine maintains thread-safe state synchronization under <code>std::mutex</code>,\
  \ enabling runtime updates without reloading weights:</p>\n<pre><code>typedef struct\
  \ {\n    float temperature;\n    float top_p;\n    float min_p;\n    float typical_p;\n\
  \    float repeat_penalty;\n    float frequency_penalty;\n    float presence_penalty;\n\
  \    int32_t top_k;\n    int32_t repeat_last_n;\n    uint32_t seed;\n    const char*\
  \ stop_tokens;\n} bitnet_params_t;\n\nint bitnet_set_params(bitnet_context_t ctx,\
  \ const bitnet_params_t* params);</code></pre>\n<h3>2. Device Routing &amp; Fallback\
  \ Policy</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr><th>Option</th><th>Target\
  \ Backend</th><th>Failure Policy</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><code>--device\
  \ auto</code></td><td>Vulkan GPU via ameva-runtime if available</td><td>Safe fallback\
  \ to ARM64 NEON CPU with INFO notice</td></tr>\n    <tr><td><code>--device gpu</code></td><td>Vulkan\
  \ GPU exclusive</td><td>Fail-Fast: Raises [ERROR: AMEVA-BITNET-E002] and exits</td></tr>\n\
  \    <tr><td><code>--device cpu</code></td><td>ARM64 NEON SIMD exclusive</td><td>Direct\
  \ CPU execution without GPU probe overhead</td></tr>\n  </tbody>\n</table>\n"
changelog:
- version: v1.4.0
  date: '2026-09-07'
  title: Dynamic Hyperparameters, Telemetry Ground Truth & Ecosystem Alignment
  type: Latest Production Release
  changes:
  - '<strong>C ABI Dynamic Parameter Synchronization (bitnet_set_params)</strong>:
    Implemented thread-safe runtime update for temperature, top_p, top_k, repeat_penalty,
    and stop tokens without context re-initialization.'
  - '<strong>Telemetry Ground Truth Hardening</strong>: Fixed prompt_tokens calculation
    in GenerationMetrics to accurately report actual token counts across streaming
    and batch runs.'
  - '<strong>Codebase Hygiene & Path Standardization</strong>: Purged developer-specific
    path (~/BitNet_ms) from Python and Node.js candidate searches; aligned Vulkan
    adapter import with ameva_runtime.adapters standard.'
  - '<strong>3-Tier Enterprise Bootstrap Installer</strong>: Upgraded install.sh to
    dynamic GitHub Releases asset resolution, trap exit cleanup, and zero-emoji compliance.'
  - '<strong>Empirical Real-Device Benchmarks</strong>: Documented verified physical
    device metrics on Galaxy S25 (5.12 tok/s) and Galaxy A35 (1.57 tok/s).'
- version: v1.1.3
  date: '2026-08-26'
  title: Zero-Isolation Fast Build & Dual CLI Namespace Architecture
  type: Stable Release
  changes:
