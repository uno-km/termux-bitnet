[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-bitnet"
version = "1.0.7"
description = "Production 1.58-bit (i2_s) BitNet On-Device Inference SDK for Android Termux & ARM64"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km", email = "dev@amevafoundation.org" }
]
keywords = ["bitnet", "llm", "arm64", "termux", "quantization", "neon", "dotprod"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
]
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
termux-bitnet = "termux_bitnet.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]